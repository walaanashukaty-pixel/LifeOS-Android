name: LifeOS Android Production Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name for manual build, e.g. 1.2.0'
        required: true
        default: '1.0.0'
        type: string
      version_code:
        description: 'Android versionCode for manual build; must increase for Google Play'
        required: true
        default: '1000000'
        type: string

permissions:
  contents: write

concurrency:
  group: lifeos-android-production
  cancel-in-progress: false

jobs:
  release:
    name: Build signed production APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      VITE_LIFEOS_PRO_PREVIEW: 'false'
      VITE_REVENUECAT_ANDROID_API_KEY: ${{ secrets.VITE_REVENUECAT_ANDROID_API_KEY }}
      VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.VITE_GOOGLE_WEB_CLIENT_ID }}
      VITE_ADMOB_REWARDED_AD_UNIT_ID: ${{ secrets.VITE_ADMOB_REWARDED_AD_UNIT_ID }}
      ADMOB_ANDROID_APP_ID: ${{ secrets.ADMOB_ANDROID_APP_ID }}
      LIFEOS_ADMOB_TEST_MODE: 'false'
      ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in \
            VITE_REVENUECAT_ANDROID_API_KEY \
            VITE_GOOGLE_WEB_CLIENT_ID \
            VITE_ADMOB_REWARDED_AD_UNIT_ID \
            ADMOB_ANDROID_APP_ID \
            ANDROID_RELEASE_KEYSTORE_BASE64 \
            ANDROID_RELEASE_STORE_PASSWORD \
            ANDROID_RELEASE_KEY_ALIAS \
            ANDROID_RELEASE_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required production secret: $name" >&2
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Resolve release version
        id: version
        shell: bash
        env:
          MANUAL_VERSION_NAME: ${{ inputs.version_name }}
          MANUAL_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
            if [[ ! "$VERSION_NAME" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "Release tags must use vMAJOR.MINOR.PATCH, for example v1.4.2" >&2
              exit 1
            fi
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            if (( MAJOR > 2000 || MINOR > 999 || PATCH > 999 )); then
              echo "Version components are too large for the automatic Android versionCode scheme." >&2
              exit 1
            fi
            VERSION_CODE=$((10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH))
          else
            VERSION_NAME="$MANUAL_VERSION_NAME"
            VERSION_CODE="$MANUAL_VERSION_CODE"
            [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version_name must be MAJOR.MINOR.PATCH" >&2; exit 1; }
            [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || { echo "version_code must be a positive integer" >&2; exit 1; }
          fi
          if (( VERSION_CODE > 2100000000 )); then
            echo "versionCode is too large for Android." >&2
            exit 1
          fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          printf 'Building LifeOS %s (versionCode %s)\n' "$VERSION_NAME" "$VERSION_CODE" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          # v4 defaults to installing the legacy `tools` package, which is no
          # longer available on current Android SDK repositories. We only need
          # sdkmanager here and install the exact SDK packages in the next step.
          packages: ''

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package.json', 'capacitor.config.ts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'npm-shrinkwrap.json', 'package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Run full regression suite
        run: npm run test:all

      - name: Build production web application
        run: npm run build

      - name: Generate Android wrapper
        run: npx cap add android

      - name: Sync Capacitor plugins
        run: npx cap sync android

      - name: Configure production Android integrations
        shell: bash
        run: |
          set -euo pipefail
          node scripts/patch-android-admob.mjs
          node scripts/patch-android-auth-deeplink.mjs
          node scripts/patch-android-notifications.mjs

      - name: Apply LifeOS launcher assets
        shell: bash
        run: |
          set -euo pipefail
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            src="native-assets/$density"
            dst="android/app/src/main/res/mipmap-$density"
            mkdir -p "$dst"
            cp "$src/ic_launcher.png" "$dst/ic_launcher.png"
            cp "$src/ic_launcher_round.png" "$dst/ic_launcher_round.png"
            cp "$src/ic_launcher_foreground.png" "$dst/ic_launcher_foreground.png"
          done

      - name: Apply Android version
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          path = Path('android/app/build.gradle')
          text = path.read_text()
          code = os.environ['VERSION_CODE']
          name = os.environ['VERSION_NAME']
          text, n1 = re.subn(r'\bversionCode\s+\d+', f'versionCode {code}', text, count=1)
          text, n2 = re.subn(r'\bversionName\s+["\'][^"\']+["\']', f'versionName "{name}"', text, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit('Could not patch versionCode/versionName in android/app/build.gradle')
          path.write_text(text)
          PY

      - name: Restore production signing key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$GITHUB_WORKSPACE/.ci/lifeos-release.jks"
          mkdir -p "$(dirname "$KEYSTORE_PATH")"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "LIFEOS_RELEASE_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

          LANG=C keytool -list -v \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$ANDROID_RELEASE_STORE_PASSWORD" \
            -alias "$ANDROID_RELEASE_KEY_ALIAS" \
            -keypass "$ANDROID_RELEASE_KEY_PASSWORD" > LifeOS-Release-Signing-Key.txt

          SHA1=$(grep -m1 'SHA1:' LifeOS-Release-Signing-Key.txt | sed 's/.*SHA1: *//')
          SHA256=$(grep -m1 'SHA256:' LifeOS-Release-Signing-Key.txt | sed 's/.*SHA256: *//')
          echo "LIFEOS_RELEASE_EXPECTED_SHA1=$SHA1" >> "$GITHUB_ENV"
          printf 'Release certificate SHA-1: %s\nRelease certificate SHA-256: %s\n' "$SHA1" "$SHA256" >> "$GITHUB_STEP_SUMMARY"

          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  lifeosRelease {
                      storeFile file(System.getenv("LIFEOS_RELEASE_KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_RELEASE_STORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_RELEASE_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_RELEASE_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.lifeosRelease
                  }
              }
          }
          GRADLE

      - name: Build signed release APK and AAB
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Verify and package release artifacts
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          set -euo pipefail
          APK="LifeOS-${VERSION_NAME}-release.apk"
          AAB="LifeOS-${VERSION_NAME}-release.aab"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          cp android/app/build/outputs/bundle/release/app-release.aab "$AAB"

          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          ACTUAL_RAW=$($APKSIGNER verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-1 digest: //p' | head -n1)
          test -n "$ACTUAL_RAW"
          ACTUAL_SHA1=$(printf '%s' "$ACTUAL_RAW" | tr '[:lower:]' '[:upper:]' | sed 's/../&:/g; s/:$//')
          if [ "$ACTUAL_SHA1" != "$LIFEOS_RELEASE_EXPECTED_SHA1" ]; then
            echo "Release APK signing mismatch. Expected $LIFEOS_RELEASE_EXPECTED_SHA1 but got $ACTUAL_SHA1" >&2
            exit 1
          fi

          AAB_VERIFY=$(LANG=C jarsigner -verify -verbose -certs "$AAB" 2>&1)
          printf '%s\n' "$AAB_VERIFY" | grep -q 'jar verified.' || {
            echo "AAB signature verification failed." >&2
            printf '%s\n' "$AAB_VERIFY" >&2
            exit 1
          }
          sha256sum "$APK" "$AAB" > LifeOS-${VERSION_NAME}-SHA256.txt
          printf 'APK signing verified. SHA-1: %s\n' "$ACTUAL_SHA1" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LifeOS-${{ steps.version.outputs.version_name }}-Production
          path: |
            LifeOS-${{ steps.version.outputs.version_name }}-release.apk
            LifeOS-${{ steps.version.outputs.version_name }}-release.aab
            LifeOS-${{ steps.version.outputs.version_name }}-SHA256.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub release for version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        shell: bash
        run: |
          set -euo pipefail
          APK="LifeOS-${VERSION_NAME}-release.apk"
          AAB="LifeOS-${VERSION_NAME}-release.aab"
          SUM="LifeOS-${VERSION_NAME}-SHA256.txt"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" "$AAB" "$SUM" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" "$AAB" "$SUM" \
              --title "LifeOS ${VERSION_NAME}" \
              --generate-notes \
              --target "$GITHUB_SHA"
          fi
