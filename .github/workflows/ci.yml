name: LifeOS CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lifeos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build web app
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'npm-shrinkwrap.json', 'package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "No npm lockfile found; using npm install. Commit package-lock.json later for fully reproducible installs."
            npm install --no-audit --no-fund
          fi

      - name: Run full regression suite
        run: npm run test:all

      - name: Build production web bundle
        env:
          VITE_LIFEOS_PRO_PREVIEW: 'false'
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.VITE_GOOGLE_WEB_CLIENT_ID }}
          VITE_REVENUECAT_ANDROID_API_KEY: ${{ secrets.VITE_REVENUECAT_ANDROID_API_KEY }}
          VITE_ADMOB_REWARDED_AD_UNIT_ID: ${{ secrets.VITE_ADMOB_REWARDED_AD_UNIT_ID }}
        run: npm run build

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: lifeos-web-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
