name: Build LifeOS APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Verify required project files
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f index.html
          test -f vite.config.ts
          test -f src/main.tsx
          test -f src/app/App.tsx
          test -f capacitor.config.ts
          echo "LifeOS source tree is present."

      - name: Verify original LifeOS source integrity
        shell: bash
        run: sha256sum -c SOURCE_HASHES.sha256

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Build original LifeOS web application
        run: npm run build

      - name: Create Android wrapper
        run: npx cap add android

      - name: Sync LifeOS into Android
        run: npx cap sync android

      - name: Apply LifeOS launcher assets
        shell: bash
        run: |
          set -euo pipefail
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            src="native-assets/$density"
            dst="android/app/src/main/res/mipmap-$density"
            mkdir -p "$dst"
            cp "$src/ic_launcher.png" "$dst/ic_launcher.png"
            cp "$src/ic_launcher_round.png" "$dst/ic_launcher_round.png"
            cp "$src/ic_launcher_foreground.png" "$dst/ic_launcher_foreground.png"
          done

      - name: Build installable APK
        shell: bash
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        shell: bash
        run: cp android/app/build/outputs/apk/debug/app-debug.apk LifeOS.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeOS-APK
          path: LifeOS.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest test APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view lifeos-latest >/dev/null 2>&1; then
            gh release upload lifeos-latest LifeOS.apk --clobber
          else
            gh release create lifeos-latest LifeOS.apk \
              --title "LifeOS Android - Latest Test APK" \
              --notes "Installable test APK built automatically from the LifeOS web application using Capacitor Android." \
              --target "${GITHUB_SHA}"
          fi
