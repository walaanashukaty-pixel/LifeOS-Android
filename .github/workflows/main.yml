name: LifeOS Android Test APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lifeos-android-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-apk:
    name: Build signed test APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VITE_LIFEOS_PRO_PREVIEW: 'true'
      VITE_REVENUECAT_ANDROID_API_KEY: ${{ secrets.VITE_REVENUECAT_ANDROID_API_KEY || 'test_ACFIesAgIbZEClHVygDGnnecaHB' }}
      VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.VITE_GOOGLE_WEB_CLIENT_ID }}
      ADMOB_ANDROID_APP_ID: ${{ secrets.ADMOB_ANDROID_APP_ID }}
      VITE_ADMOB_REWARDED_AD_UNIT_ID: ${{ secrets.VITE_ADMOB_REWARDED_AD_UNIT_ID || 'ca-app-pub-3940256099942544/5224354917' }}
      LIFEOS_ADMOB_TEST_MODE: 'true'
      LIFEOS_DEBUG_KEYSTORE_BASE64: ${{ secrets.LIFEOS_DEBUG_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required project files
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f index.html
          test -f vite.config.ts
          test -f src/main.tsx
          test -f src/app/App.tsx
          test -f src/app/components/MobileHome.tsx
          test -f src/app/agent/agent-types.ts
          test -f src/app/agent/LifeOSAgentPage.tsx
          test -f supabase/functions/lifeos-agent/index.ts
          test -f src/utils/notifications.ts
          test -f src/utils/oauth-model.ts
          test -f src/utils/subscriptions.ts
          test -f src/app/agent/ProAIHomeSection.tsx
          test -f supabase/functions/lifeos-agent/phase2-policy.ts
          test -f src/app/pro/DailyReviewPage.tsx
          test -f src/app/pro/ProDashboardInsightCard.tsx
          test -f src/app/pro/AIAnalyticsPanel.tsx
          test -f supabase/functions/lifeos-agent/learning.ts
          test -f src/app/pro/ai-settings-service.ts
          test -f src/app/pro/smart-notifications.ts
          test -f supabase/functions/lifeos-agent/settings.ts
          test -f supabase/functions/lifeos-agent/reflections.ts
          test -f supabase/functions/lifeos-agent/personalization.ts
          test -f src/app/pro/ProOnboardingFlow.tsx
          test -f src/app/pro/personalization-service.ts
          test -f supabase/migrations/20260910130425_create_ai_personalization_profiles.sql
          test -f scripts/patch-android-auth-deeplink.mjs
          test -f scripts/patch-android-admob.mjs
          test -f src/utils/ads/reward-policy.ts
          test -f capacitor.config.ts
          echo "LifeOS mobile source tree is present."

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          # v4 defaults to installing the legacy `tools` package, which is no
          # longer available on current Android SDK repositories. We only need
          # sdkmanager here and install the exact SDK packages in the next step.
          packages: ''

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package.json', 'capacitor.config.ts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'npm-shrinkwrap.json', 'package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Run product polish and QA tests
        run: npm run test:qa

      - name: Run mobile tests
        run: npm run test:mobile

      - name: Run recurrence tests
        run: npm run test:recurrence

      - name: Run auth and subscription tests
        run: npm run test:auth

      - name: Run cloud data tests
        run: npm run test:data

      - name: Run rewarded ads tests
        run: npm run test:ads

      - name: Run LifeOS Agent tests
        run: npm run test:agent

      - name: Run LifeOS Agent Phase 2 tests
        run: npm run test:phase2

      - name: Run LifeOS Pro P0 tests
        run: npm run test:pro-p0

      - name: Run LifeOS Pro P1 tests
        run: npm run test:pro-p1

      - name: Run LifeOS Pro P2 tests
        run: npm run test:pro-p2

      - name: Build web application
        run: npm run build

      - name: Generate Android wrapper
        run: npx cap add android

      - name: Sync Capacitor plugins
        run: npx cap sync android

      - name: Apply Android AdMob App ID
        run: node scripts/patch-android-admob.mjs

      - name: Apply Android auth deep link and billing launch mode
        run: node scripts/patch-android-auth-deeplink.mjs

      - name: Apply Android notification permissions
        run: node scripts/patch-android-notifications.mjs

      - name: Apply LifeOS launcher assets
        shell: bash
        run: |
          set -euo pipefail
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            src="native-assets/$density"
            dst="android/app/src/main/res/mipmap-$density"
            mkdir -p "$dst"
            cp "$src/ic_launcher.png" "$dst/ic_launcher.png"
            cp "$src/ic_launcher_round.png" "$dst/ic_launcher_round.png"
            cp "$src/ic_launcher_foreground.png" "$dst/ic_launcher_foreground.png"
          done

      - name: Restore stable test signing key
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${LIFEOS_DEBUG_KEYSTORE_BASE64:-}" ]; then
            echo "Missing GitHub secret LIFEOS_DEBUG_KEYSTORE_BASE64." >&2
            echo "This key is required so Google Sign-In keeps the same SHA-1 across test APK builds." >&2
            exit 1
          fi

          KEYSTORE_PATH="$GITHUB_WORKSPACE/.ci/lifeos-debug.keystore"
          mkdir -p "$(dirname "$KEYSTORE_PATH")"
          printf '%s' "$LIFEOS_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "LIFEOS_DEBUG_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

          LANG=C keytool -list -v \
            -keystore "$KEYSTORE_PATH" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android > LifeOS-Test-Signing-Key.txt

          SHA1=$(grep -m1 'SHA1:' LifeOS-Test-Signing-Key.txt | sed 's/.*SHA1: *//')
          echo "LIFEOS_EXPECTED_SHA1=$SHA1" >> "$GITHUB_ENV"

          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  lifeosDebug {
                      storeFile file(System.getenv("LIFEOS_DEBUG_KEYSTORE_PATH"))
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.lifeosDebug
                  }
              }
          }
          GRADLE

      - name: Build test APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify and package test APK
        shell: bash
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/debug/app-debug.apk LifeOS-Test.apk
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          ACTUAL_RAW=$($APKSIGNER verify --print-certs LifeOS-Test.apk | sed -n 's/^Signer #1 certificate SHA-1 digest: //p' | head -n1)
          test -n "$ACTUAL_RAW"
          ACTUAL_SHA1=$(printf '%s' "$ACTUAL_RAW" | tr '[:lower:]' '[:upper:]' | sed 's/../&:/g; s/:$//')
          if [ "$ACTUAL_SHA1" != "$LIFEOS_EXPECTED_SHA1" ]; then
            echo "APK signing mismatch. Expected $LIFEOS_EXPECTED_SHA1 but got $ACTUAL_SHA1" >&2
            exit 1
          fi
          printf 'SHA-1: %s\n' "$ACTUAL_SHA1" > LifeOS-SHA1.txt
          sha256sum LifeOS-Test.apk > LifeOS-Test-SHA256.txt
          printf 'Actual APK SHA-1: %s\n' "$ACTUAL_SHA1" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LifeOS-Test-APK
          path: |
            LifeOS-Test.apk
            LifeOS-SHA1.txt
            LifeOS-Test-SHA256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest test APK release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Recreate the moving test release so its tag always points at this exact commit.
          if gh release view lifeos-mobile-latest >/dev/null 2>&1; then
            gh release delete lifeos-mobile-latest --yes --cleanup-tag
          fi
          gh release create lifeos-mobile-latest \
            LifeOS-Test.apk LifeOS-SHA1.txt LifeOS-Test-SHA256.txt \
            --title "LifeOS Mobile - Latest Test APK" \
            --notes "Automated test build from the latest main/master source. Pro preview and AdMob test mode are enabled; this is not the Google Play production build." \
            --target "$GITHUB_SHA"
